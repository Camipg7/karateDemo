name: Karate API - CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
jobs:
  karate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar Smoke
        if: github.event_name == 'pull_request'
        run: mvn -B clean test "-Dkarate.options=--tags @smoke"

      - name: Ejecutar Regression
        if: github.event_name != 'pull_request'
        run: mvn -B clean test "-Dkarate.options=--tags @regression"

      - name: Verificar seguridad de reportes
        run: |
          if grep -R -E -q 'eyJhbGci|emilyspass' target/karate-reports; then
            echo "::error::Posibles datos sensibles en reportes"
            exit 1
          fi

      - name: Guardar reportes Karate
        uses: actions/upload-artifact@v4
        with:
          name: karate-reportes
          path: target/karate-reports/
          if-no-files-found: error
          retention-days: 7
